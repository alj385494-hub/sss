#         - -i
#
# ## 其他需要注意的 Windows 专有路径
#
# 复核扫过一遍，主 profile 里只有 terminal-controller 这一处是裸写的 Windows 绝对路径。
# 其余平台相关的条目都已有 `disabled: !!js process.platform ...` 分流：
#   第 338/342 行、692/696 行、879/883 行 附近（tool-bash / tool-pwsh 系列）
#
# 如果你在本机又加了新的工具条目，记得同样加平台判断 ——
# 判据：**路径里出现盘符（`X:`）或反斜杠，就必须有平台开关。**
